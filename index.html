<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT UI Clone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="logo">AI Chat Bot</div>
      <div class="menu">
        <p>Today</p>
        <div class="menu-item active">Cloud Project Ideas</div>
        <p>Yesterday</p>
        <div class="menu-item active">AI Project Underprocess
        </div>
        <p>Previous 7 Days</p>
      </div>
      <div class="upgrade">
        <button>Any Plan</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <span class="title">AI Chat Bot</span>
        <div class="actions">
          
          <div class="avatar">A</div>
        </div>
      </div>
      <div class="chat-area"></div>
      <div class="chat-input">
        <input type="text" placeholder="Ask anything" />
        <button>Send</button>
      </div>
    </main>
  </div>
</body>
</html>
